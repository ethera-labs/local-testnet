name: Feature branch workflow

on:
  push:
    branches-ignore:
      - main

env:
  GO_VERSION: 1.26

jobs:
  go-lint:
    name: Go Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: actions/setup-go@v6 # v6.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Lint
        uses: golangci/golangci-lint-action@v9 # v9.0.0
        with:
          version: latest

  go-build:
    name: Go Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: actions/setup-go@v6 # v6.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build
        run: make build

  go-test:
    name: Go Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: actions/setup-go@v6 # v6.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Test
        run: make test

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [ "go-lint", "go-build", "go-test" ]
    permissions:
      id-token: write
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Docker Build
        uses: compose-network/github-actions/actions/docker@v0.6.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          image-description: This Docker image is a CLI tool for building and managing Ethera Labs local testnets
          dockerfile-path: build/Dockerfile
          image-architectures: linux/amd64
          with-push: false