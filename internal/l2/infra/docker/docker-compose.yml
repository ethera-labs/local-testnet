services:
  publisher:
    build:
      context: ${PUBLISHER_PATH}
      dockerfile: ${ROOT_DIR}/internal/l2/infra/docker/publisher.Dockerfile
      ssh:
        - default
    image: local/publisher:dev
    container_name: publisher
    labels:
      - "stack=localnet-l2"
    networks:
      - localnet-l2
    environment:
      SERVER_LISTEN_ADDR: ":8080"
      METRICS_ENABLED: "true"
      METRICS_PORT: "8081"
      LOG_LEVEL: "debug"
      LOG_PRETTY: "true"
      AUTH_ENABLED: "false"
      PROOFS_ENABLED: "${PROOFS_ENABLED:-false}"
      PROOFS_REQUIRE_PROOF: "${PROOFS_REQUIRE_PROOF:-false}"
      PROOFS_PROVER_BASE_URL: "${PROOFS_PROVER_BASE_URL:-}"
      PROOFS_PROVER_PROOF_TYPE: "${PROOFS_PROVER_PROOF_TYPE:-groth16}"
      PROOFS_COLLECTOR_REQUIRE_ALL_CHAINS: "${PROOFS_COLLECTOR_REQUIRE_ALL_CHAINS:-false}"
      CONSENSUS_TIMEOUT: "20s"
      L1_RPC_ENDPOINT: "${L1_EL_URL}"
      L1_SUPERBLOCK_CONTRACT: "${SP_L1_SUPERBLOCK_CONTRACT}"
      L1_SHARED_PUBLISHER_PK_HEX: "${SP_L1_SHARED_PUBLISHER_PK_HEX:-${WALLET_PRIVATE_KEY}}"
      L1_FROM_ADDRESS: "${SP_L1_FROM_ADDRESS:-${WALLET_ADDRESS}}"
      L1_DISPUTE_GAME_FACTORY: "${SP_L1_DISPUTE_GAME_FACTORY}"
      L1_CHAIN_ID: "${L1_CHAIN_ID}"
      L1_COMPOSE_NETWORK_NAME: "${L1_COMPOSE_NETWORK_NAME}"
      L1_ETHERA_NETWORK_NAME: "${ETHERA_NETWORK_NAME}"
      REGISTRY_PATH: "/workspace/.localnet/registry"  # Custom registry with local chain definitions
    volumes:
      - ${ROOT_DIR}/.localnet/registry:/workspace/.localnet/registry:ro
    ports:
      - "18080:8080"
      - "18081:8081"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8081/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  op-geth-a:
    build:
      context: ${OP_GETH_PATH}
      dockerfile: ${ROOT_DIR}/internal/l2/infra/docker/op-geth.Dockerfile
      additional_contexts:
        - publisher=${PUBLISHER_PATH}
    image: local/op-geth:dev
    container_name: op-geth-a
    labels:
      - "stack=localnet-l2"
    networks:
      - localnet-l2
    environment:
      ROLLUP_CHAIN_ID: "${ROLLUP_A_CHAIN_ID}"
      WALLET_PRIVATE_KEY: "${WALLET_PRIVATE_KEY}"
      SEQUENCER_PRIVATE_KEY: "${SEQUENCER_PRIVATE_KEY}"
      SSV_CIRC_TIMEOUT_MS: "${SSV_CIRC_TIMEOUT_MS:-20000}"
      COORDINATOR_PRIVATE_KEY: "${COORDINATOR_PRIVATE_KEY}"
      MAILBOX_A: "${MAILBOX_A:-}"
      MAILBOX_B: "${MAILBOX_B:-}"
    volumes:
      - rollup-a-geth:/data
      - ${ROLLUP_A_CONFIG_PATH:-../../networks/rollup-a}:/config:ro
      - ${ROLLUP_B_CONFIG_PATH:-../../networks/rollup-b}:/config_b:ro
      - ${ROOT_DIR}/.localnet/registry:/registry:ro
    ports:
      - "${ROLLUP_A_RPC_PORT}:8545"
      - "18546:8546"
      - "18551:8551"
      - "19898:9898"
    depends_on:
      - publisher
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 3
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8545 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    entrypoint: []
    command:
      - /bin/sh
      - -c
      - |
        set -eu

        COORDINATOR_KEY=$$(printf '%s' "$${COORDINATOR_PRIVATE_KEY:-}" | sed 's/^0x//')
        if [ -z "$$COORDINATOR_KEY" ]; then
          echo "[error] COORDINATOR_PRIVATE_KEY is required" >&2
          exit 1
        fi
        SEQUENCER_KEY=$$(printf '%s' "$${SEQUENCER_PRIVATE_KEY:-}" | sed 's/^0x//')

        # Initialize geth if needed
        if [ ! -f /data/geth/chaindata/CURRENT ]; then
          echo '[*] initializing op-geth datadir'
          GETH_COORDINATOR_KEY="$$COORDINATOR_KEY" geth --networkid=$${ROLLUP_CHAIN_ID} init --state.scheme=hash --datadir /data /config/genesis.json
          if [ ! -d /data/keystore ] || [ -z $$(ls -A /data/keystore 2>/dev/null) ]; then
            if [ -n "$$WALLET_PRIVATE_KEY" ] && [ "$$WALLET_PRIVATE_KEY" != "$$COORDINATOR_KEY" ]; then
              printf '%s' "$${WALLET_PRIVATE_KEY}" | sed 's/^0x//' | geth account import --datadir /data --password /config/password.txt /dev/stdin >/dev/null
            fi
            if [ -n "$$SEQUENCER_PRIVATE_KEY" ] && [ "$$SEQUENCER_PRIVATE_KEY" != "$$WALLET_PRIVATE_KEY" ] && [ "$$SEQUENCER_PRIVATE_KEY" != "$$COORDINATOR_KEY" ]; then
              printf '%s' "$${SEQUENCER_PRIVATE_KEY}" | sed 's/^0x//' | geth account import --datadir /data --password /config/password.txt /dev/stdin >/dev/null
            fi
          fi
        fi

        echo "[*] Starting geth"

        GETH_HELP_FILE=$$(mktemp)
        if ! geth --help >"$$GETH_HELP_FILE" 2>&1; then
          cat "$$GETH_HELP_FILE" >&2
          rm -f "$$GETH_HELP_FILE"
          exit 1
        fi

        set -- geth \
          --verbosity=4 \
          --datadir /data \
          --http \
          --http.addr=0.0.0.0 \
          --http.port=8545 \
          --http.corsdomain='*' \
          --http.vhosts='*' \
          --http.api=web3,debug,eth,txpool,net,engine,miner \
          --ws \
          --ws.addr=0.0.0.0 \
          --ws.port=8546 \
          --ws.origins='*' \
          --authrpc.addr=0.0.0.0 \
          --authrpc.port=8551 \
          --authrpc.vhosts='*' \
          --authrpc.jwtsecret=/config/jwt.txt \
          --syncmode=full --gcmode=archive --nodiscover --maxpeers=0 \
          --networkid=$${ROLLUP_CHAIN_ID} \
          --miner.gasprice=0 \
          --metrics \
          --metrics.addr=0.0.0.0 \
          --metrics.port=6060 \
          --rollup.computependingblock=true \
          --registry.path=/registry \
          --sp.addr=publisher:8080

        if grep -q -- '--coordinator.key' "$$GETH_HELP_FILE"; then
          set -- "$$@" "--coordinator.key=$${COORDINATOR_KEY}"
        fi
        if grep -q -- '--sequencer.key' "$$GETH_HELP_FILE"; then
          if [ -z "$$SEQUENCER_KEY" ]; then
            echo "[error] SEQUENCER_PRIVATE_KEY is required by this geth build" >&2
            rm -f "$$GETH_HELP_FILE"
            exit 1
          fi
          set -- "$$@" "--sequencer.key=$${SEQUENCER_KEY}"
        fi

        rm -f "$$GETH_HELP_FILE"
        exec "$$@"

  op-alt-da-a:
    build:
      context: ${COMPOSE_CONTRACTS_PATH}/L1-settlement/lib/optimism
      dockerfile: ${ROOT_DIR}/internal/l2/infra/docker/op-alt-da.Dockerfile
    image: local/op-alt-da:dev
    container_name: op-alt-da-a
    labels:
      - "stack=localnet-l2"
    networks:
      - localnet-l2
    environment:
      OP_ALTDA_SERVER_GENERIC_COMMITMENT: "${ALTDA_USE_GENERIC_COMMITMENT}"
    entrypoint: []
    command:
      - /bin/sh
      - -lc
      - |
        set -eu
        mkdir -p /data
        exec da-server \
          --addr=0.0.0.0 \
          --port=3100 \
          --file.path=/data \
          --log.level=info
    ports:
      - "3100:3100"
    volumes:
      - op-alt-da-a-data:/data
    restart: unless-stopped

  op-alt-da-b:
    build:
      context: ${COMPOSE_CONTRACTS_PATH}/L1-settlement/lib/optimism
      dockerfile: ${ROOT_DIR}/internal/l2/infra/docker/op-alt-da.Dockerfile
    image: local/op-alt-da:dev
    container_name: op-alt-da-b
    labels:
      - "stack=localnet-l2"
    networks:
      - localnet-l2
    environment:
      OP_ALTDA_SERVER_GENERIC_COMMITMENT: "${ALTDA_USE_GENERIC_COMMITMENT}"
    entrypoint: []
    command:
      - /bin/sh
      - -lc
      - |
        set -eu
        mkdir -p /data
        exec da-server \
          --addr=0.0.0.0 \
          --port=3100 \
          --file.path=/data \
          --log.level=info
    ports:
      - "3101:3100"
    volumes:
      - op-alt-da-b-data:/data
    restart: unless-stopped

  op-node-a:
    image: us-docker.pkg.dev/oplabs-tools-artifacts/images/op-node:${OP_NODE_IMAGE_TAG}
    container_name: op-node-a
    labels:
      - "stack=localnet-l2"
    networks:
      - localnet-l2
    depends_on:
      op-geth-a:
        condition: service_healthy
    environment:
      OP_NODE_L1_ETH_RPC: "${L1_EL_URL}"
      OP_NODE_L1_BEACON: "${L1_CL_URL}"
      OP_NODE_L2_ENGINE_RPC: "http://op-geth-a:8551"
      OP_NODE_L2_ENGINE_AUTH: "/config/jwt.txt"
      OP_NODE_ROLLUP_CONFIG: "/config/rollup.json"
      OP_NODE_ROLLUP_L1_CHAIN_CONFIG: "/config/l1-genesis.json"
      OP_NODE_P2P_DISABLE: "true"
      OP_NODE_SEQUENCER_ENABLED: "true"
      OP_NODE_SEQUENCER_L1_CONFS: "0" #"5" Don't wait for confirmations
      OP_NODE_VERIFIER_L1_CONFS: "0" #"4" Don't wait for confirmations
      OP_NODE_P2P_SEQUENCER_KEY: "${SEQUENCER_PRIVATE_KEY:-${WALLET_PRIVATE_KEY}}"
      OP_NODE_RPC_ADDR: "0.0.0.0"
      OP_NODE_RPC_PORT: "9545"
      OP_NODE_RPC_ENABLE_ADMIN: "true"
      OP_NODE_LOG_LEVEL: "info"
      OP_NODE_SAFEDB_PATH: "/data/safedb"
      OP_NODE_ALTDA_ENABLED: "${ALTDA_ENABLED}"
      OP_NODE_ALTDA_DA_SERVER: "${ALTDA_DA_SERVER_A}"
      OP_NODE_ALTDA_VERIFY_ON_READ: "${ALTDA_VERIFY_ON_READ}"
      OP_NODE_ALTDA_DA_SERVICE: "${ALTDA_DA_SERVICE}"
      OP_NODE_ALTDA_PUT_TIMEOUT: "${ALTDA_PUT_TIMEOUT}"
      OP_NODE_ALTDA_GET_TIMEOUT: "${ALTDA_GET_TIMEOUT}"
      OP_NODE_ALTDA_MAX_CONCURRENT_DA_REQUESTS: "${ALTDA_MAX_CONCURRENT_DA_REQUESTS}"
    volumes:
      - rollup-a-opnode:/data
      - ${ROLLUP_A_CONFIG_PATH:-../../networks/rollup-a}/safedb:/data/safedb
      - ${ROLLUP_A_CONFIG_PATH:-../../networks/rollup-a}:/config:ro
    ports:
      - "19545:9545"

