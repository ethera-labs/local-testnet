      OP_PROPOSER_GAME_TYPE: "1"
      OP_PROPOSER_RPC_PORT: "8560"
      OP_PROPOSER_RPC_ADDR: "0.0.0.0"
      OP_PROPOSER_RPC_ENABLE_ADMIN: "true"
