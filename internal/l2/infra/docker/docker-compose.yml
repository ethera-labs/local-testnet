      OP_BATCHER_RPC_PORT: "8548"
      OP_BATCHER_RPC_ENABLE_ADMIN: "true"
      OP_BATCHER_ALTDA_ENABLED: "${ALTDA_ENABLED}"
      OP_BATCHER_ALTDA_DA_SERVER: "${ALTDA_DA_SERVER_A}"
      OP_BATCHER_ALTDA_VERIFY_ON_READ: "${ALTDA_VERIFY_ON_READ}"
      OP_BATCHER_ALTDA_DA_SERVICE: "${ALTDA_DA_SERVICE}"
      OP_BATCHER_ALTDA_PUT_TIMEOUT: "${ALTDA_PUT_TIMEOUT}"
      OP_BATCHER_ALTDA_GET_TIMEOUT: "${ALTDA_GET_TIMEOUT}"
      OP_BATCHER_ALTDA_MAX_CONCURRENT_DA_REQUESTS: "${ALTDA_MAX_CONCURRENT_DA_REQUESTS}"
    ports:
      - "18548:8548"

  op-proposer-a:
    image: us-docker.pkg.dev/oplabs-tools-artifacts/images/op-proposer:${OP_PROPOSER_IMAGE_TAG}
