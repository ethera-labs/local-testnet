      OP_PROPOSER_PRIVATE_KEY: "${ROLLUP_B_L1_SENDER_PRIVATE_KEY:-${WALLET_PRIVATE_KEY}}"
      OP_PROPOSER_POLL_INTERVAL: "12s"
      OP_PROPOSER_PROPOSAL_INTERVAL: "10m"
      OP_PROPOSER_GAME_TYPE: "1"
      OP_PROPOSER_RPC_PORT: "8560"
      OP_PROPOSER_RPC_ADDR: "0.0.0.0"
      OP_PROPOSER_RPC_ENABLE_ADMIN: "true"
    ports:
      - "28560:8560"

  op-succinct-db-a:
    image: postgres:15
    container_name: op-succinct-db-a
    labels:
      - "stack=localnet-l2"
    networks:
      - localnet-l2
    environment:
      POSTGRES_USER: op-succinct
      POSTGRES_DB: op-succinct
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - op-succinct-db-a:/var/lib/postgresql/data

  op-succinct-a:
    build:
      context: ${OP_SUCCINCT_PATH}
      dockerfile: ${OP_SUCCINCT_A_DOCKERFILE:-./validity/Dockerfile}
      args:
        CARGO_PROFILE: ${OP_SUCCINCT_CARGO_PROFILE:-debug}
        CARGO_BUILD_JOBS: ${OP_SUCCINCT_BUILD_JOBS:-2}
    image: local/op-succinct:dev
    container_name: op-succinct-a
    labels:
      - "stack=localnet-l2"
    networks:
      - localnet-l2
    depends_on:
      - op-proposer-a
      - op-proposer-b
      - op-succinct-db-a
    env_file:
      - ${OP_SUCCINCT_ENV_FILE_A}
    environment:
      DATABASE_URL: postgres://op-succinct@op-succinct-db-a:5432/op-succinct
    command:
      - /bin/sh
      - -lc
      - |
        set -eu
        until psql "$$DATABASE_URL" -tAc "SELECT 1" >/dev/null 2>&1; do
          sleep 1
        done
        psql "$$DATABASE_URL" -v ON_ERROR_STOP=1 -c "DO \$\$ BEGIN IF to_regclass('public.chain_locks') IS NOT NULL THEN DELETE FROM chain_locks; END IF; END \$\$;"
        exec /usr/local/bin/validity-proposer
    volumes:
      - ${OP_SUCCINCT_PATH}/configs/L1:/app/configs/L1:ro
      - op-succinct-sp1-cache:/root/.sp1/circuits
    restart: unless-stopped

  op-succinct-db-b:
    image: postgres:15
    container_name: op-succinct-db-b
    labels:
      - "stack=localnet-l2"
    networks:
      - localnet-l2
    environment:
      POSTGRES_USER: op-succinct
      POSTGRES_DB: op-succinct
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - op-succinct-db-b:/var/lib/postgresql/data

  op-succinct-b:
    build:
      context: ${OP_SUCCINCT_PATH}
      dockerfile: ${OP_SUCCINCT_B_DOCKERFILE:-./validity/Dockerfile}
      args:
        CARGO_PROFILE: ${OP_SUCCINCT_CARGO_PROFILE:-debug}
        CARGO_BUILD_JOBS: ${OP_SUCCINCT_BUILD_JOBS:-2}
    image: local/op-succinct:dev
    container_name: op-succinct-b
    labels:
      - "stack=localnet-l2"
    networks:
      - localnet-l2
    depends_on:
      - op-proposer-a
      - op-proposer-b
      - op-succinct-db-b
    env_file:
      - ${OP_SUCCINCT_ENV_FILE_B}
    environment:
      DATABASE_URL: postgres://op-succinct@op-succinct-db-b:5432/op-succinct
    command:
      - /bin/sh
      - -lc
      - |
        set -eu
        until psql "$$DATABASE_URL" -tAc "SELECT 1" >/dev/null 2>&1; do
          sleep 1
        done
        psql "$$DATABASE_URL" -v ON_ERROR_STOP=1 -c "DO \$\$ BEGIN IF to_regclass('public.chain_locks') IS NOT NULL THEN DELETE FROM chain_locks; END IF; END \$\$;"
        exec /usr/local/bin/validity-proposer
    volumes:
      - ${OP_SUCCINCT_PATH}/configs/L1:/app/configs/L1:ro
      - op-succinct-sp1-cache:/root/.sp1/circuits
    restart: unless-stopped

  superblock-prover:
    build:
      context: ${SUPERBLOCK_PROVER_PATH}
      dockerfile: Dockerfile
      ssh:
        - default
    image: local/superblock-prover:dev
    container_name: superblock-prover
    labels:
      - "stack=localnet-l2"
    networks:
      - localnet-l2
    environment:
      SP1_PROVER: "${SUPERBLOCK_PROVER_SP1_PROVER:-cpu}"
      NETWORK_PRIVATE_KEY: "${NETWORK_PRIVATE_KEY:-}"
      PROVING_TIMEOUT: "${SUPERBLOCK_PROVER_PROVING_TIMEOUT:-600}"
      MIN_AUCTION_PERIOD: "${SUPERBLOCK_PROVER_MIN_AUCTION_PERIOD:-1}"
      CYCLE_LIMIT: "${SUPERBLOCK_PROVER_CYCLE_LIMIT:-150000000000}"
      GAS_LIMIT: "${SUPERBLOCK_PROVER_GAS_LIMIT:-2000000000}"
      RUST_LOG: "info"
    ports:
      - "15000:5000"
    volumes:
      - superblock-prover-sp1-cache:/root/.sp1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

volumes:
  rollup-a-geth:
  rollup-b-geth:
  rollup-a-opnode:
  rollup-b-opnode:
  op-alt-da-a-data:
  op-alt-da-b-data:
  op-succinct-db-a:
  op-succinct-db-b:
  op-succinct-sp1-cache:
  superblock-prover-sp1-cache:

networks:
  localnet-l2:
    driver: bridge
    name: localnet-l2
    labels:
      stack: localnet-l2
