# Build context is resolved from l2.repositories.bundler.
services:
  bundler-a:
    build:
      context: ${BUNDLER_PATH}
      dockerfile: Dockerfile
      ssh:
        - default
    image: local/ethera-bundler:dev
    container_name: bundler-a
    labels:
      - "stack=localnet-l2"
    networks:
      - localnet-l2
    ports:
      - "${BUNDLER_ROLLUP_A_API_PORT:-17082}:8082"
    environment:
      ETHERA_BUNDLER_LISTEN_ADDR: "0.0.0.0:8082"
      ETHERA_BUNDLER_CHAIN_ID: "${ROLLUP_A_CHAIN_ID}"
      ETHERA_BUNDLER_EXEC_RPC_URL: "http://op-rbuilder-a:8545"
      ETHERA_BUNDLER_SEQUENCER_KEY: "${WALLET_PRIVATE_KEY}"
      ETHERA_BUNDLER_ENTRYPOINT_ADDRESS: "${ENTRYPOINT_A}"
      RUST_LOG: "ethera_bundler=debug,info"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8082 || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 5

  bundler-b:
    build:
      context: ${BUNDLER_PATH}
      dockerfile: Dockerfile
      ssh:
        - default
    image: local/ethera-bundler:dev
    container_name: bundler-b
    labels:
      - "stack=localnet-l2"
    networks:
      - localnet-l2
    ports:
      - "${BUNDLER_ROLLUP_B_API_PORT:-27082}:8082"
    environment:
      ETHERA_BUNDLER_LISTEN_ADDR: "0.0.0.0:8082"
      ETHERA_BUNDLER_CHAIN_ID: "${ROLLUP_B_CHAIN_ID}"
      ETHERA_BUNDLER_EXEC_RPC_URL: "http://op-rbuilder-b:8545"
      ETHERA_BUNDLER_SEQUENCER_KEY: "${WALLET_PRIVATE_KEY}"
      ETHERA_BUNDLER_ENTRYPOINT_ADDRESS: "${ENTRYPOINT_B}"
      RUST_LOG: "ethera_bundler=debug,info"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8082 || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 5
