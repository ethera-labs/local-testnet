# Overlay: run the validator EL (rollup-boost L2_URL) as op-besu instead of op-reth.
# Overrides the validator-el-a/validator-el-b services in place — same ports, volumes and
# /config mount — so the validator-el-a/validator-el-b network aliases (rollup-boost
# L2_URL=http://validator-el-a:8551, op-node, batcher, op-succinct) all still resolve.
# Applied when l2.validator-el=op-besu (--validator-el op-besu). op-besu runs the full
# Isthmus schedule (Prague EVM, final EIP-7685, EIP-2935), matching stage.
# Requires a locally-built image tagged ${OP_BESU_IMAGE:-local/op-besu:dev}.

services:
  validator-el-a:
    # Container is named op-besu-a so `docker ps` / `make show-l2` show the real client,
    # while the validator-el-a service/alias stays stable for everything that targets it.
    container_name: op-besu-a
    image: ${OP_BESU_IMAGE:-local/op-besu:dev}
    entrypoint: ["besu"]
    command:
      - --genesis-file=/config/genesis.json
      - --data-path=/opt/besu/data
      # op-succinct witnessgen requests historical state back to genesis; Bonsai's
      # default 512-block window makes those eth_getProof/state queries fail and the
      # proposer loop errors ("connection closed before message completed"). Widen it.
      - --bonsai-historical-block-limit=100000
      # Besu requires the trie-logs pruning window to exceed the historical-block-limit.
      - --bonsai-trie-logs-pruning-window-size=120000
      - --network-id=${ROLLUP_A_CHAIN_ID}
      - --rpc-http-enabled
      - --rpc-http-host=0.0.0.0
      - --rpc-http-port=8545
      - --rpc-http-api=ETH,NET,WEB3,DEBUG,TXPOOL,ADMIN
      # op-succinct witnessgen fires ~100+ concurrent RPC requests; Besu's default
      # max-active-connections=80 rejects the excess ("connection closed before
      # message completed"), which rolls back the proposer's range requests.
      - --rpc-http-max-active-connections=2000
      - --rpc-http-cors-origins=*
      - --host-allowlist=*
      - --engine-rpc-enabled
      - --engine-rpc-port=8551
      - --engine-jwt-disabled
      - --engine-host-allowlist=*
      - --p2p-enabled=false

  # op-besu doesn't implement the reth/op-geth `miner_setMaxDASize` RPC that the
  # op-batcher's DA-throttling loop probes at startup; without it the batcher
  # logs "SetMaxDASize RPC method unavailable … shutting down" and stops, so no
  # batches reach L1 and the safe head never advances. Disable DA throttling
  # (Zero disables it) for op-besu runs. op-reth supports the method, so its
  # base-compose config keeps throttling enabled.
  op-batcher-a:
    environment:
      OP_BATCHER_THROTTLE_UNSAFE_DA_BYTES_LOWER_THRESHOLD: "0"
  op-batcher-b:
    environment:
      OP_BATCHER_THROTTLE_UNSAFE_DA_BYTES_LOWER_THRESHOLD: "0"

  validator-el-b:
    container_name: op-besu-b
    image: ${OP_BESU_IMAGE:-local/op-besu:dev}
    entrypoint: ["besu"]
    command:
      - --genesis-file=/config/genesis.json
      - --data-path=/opt/besu/data
      - --bonsai-historical-block-limit=100000
      # Besu requires the trie-logs pruning window to exceed the historical-block-limit.
      - --bonsai-trie-logs-pruning-window-size=120000
      - --network-id=${ROLLUP_B_CHAIN_ID}
      - --rpc-http-enabled
      - --rpc-http-host=0.0.0.0
      - --rpc-http-port=8545
      - --rpc-http-api=ETH,NET,WEB3,DEBUG,TXPOOL,ADMIN
      # op-succinct witnessgen fires ~100+ concurrent RPC requests; Besu's default
      # max-active-connections=80 rejects the excess ("connection closed before
      # message completed"), which rolls back the proposer's range requests.
      - --rpc-http-max-active-connections=2000
      - --rpc-http-cors-origins=*
      - --host-allowlist=*
      - --engine-rpc-enabled
      - --engine-rpc-port=8551
      - --engine-jwt-disabled
      - --engine-host-allowlist=*
      - --p2p-enabled=false
