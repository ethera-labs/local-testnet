# CrossScout overlay: per-rollup cross-chain indexers plus a shared API and explorer.
# Build context is resolved from l2.repositories.cross-scout.

services:
  cross-scout-postgres:
    image: postgres:16-alpine
    container_name: cross-scout-postgres
    labels:
      - "stack=localnet-l2"
    networks:
      - localnet-l2
    environment:
      POSTGRES_USER: crossscout
      POSTGRES_PASSWORD: crossscout
      POSTGRES_DB: crossscout
    ports:
      - "${CROSS_SCOUT_POSTGRES_PORT:-15432}:5432"
    volumes:
      - cross-scout-postgres:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U crossscout" ]
      interval: 5s
      timeout: 3s
      retries: 10

  cross-scout-redis:
    image: redis:7-alpine
    container_name: cross-scout-redis
    labels:
      - "stack=localnet-l2"
    networks:
      - localnet-l2
    command: [ "redis-server", "--appendonly", "yes" ]
    ports:
      - "${CROSS_SCOUT_REDIS_PORT:-16379}:6379"
    volumes:
      - cross-scout-redis:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10

  cross-scout-indexer-a:
    build:
      context: ${CROSS_SCOUT_PATH}
      dockerfile: Dockerfile.indexer
    image: local/cross-scout-indexer:dev
    container_name: cross-scout-indexer-a
    labels:
      - "stack=localnet-l2"
    networks:
      - localnet-l2
    depends_on:
      cross-scout-postgres:
        condition: service_healthy
      cross-scout-redis:
        condition: service_healthy
    environment:
      HOST_CHAIN_ID: "${ROLLUP_A_CHAIN_ID}"
      L1_CHAIN_ID: "${L1_CHAIN_ID}"
      DATABASE_URL: "${CROSS_SCOUT_DATABASE_URL}"
      REDIS_URL: "${CROSS_SCOUT_REDIS_URL}"
      EL_RPC_URLS: "${CROSS_SCOUT_EL_RPC_URLS}"
      FLASHBLOCKS_WS_URLS: "${CROSS_SCOUT_FLASHBLOCKS_WS_URLS:-}"
      L1_RPC_URL: "${L1_EL_URL}"
      MAILBOX_ADDRESS: "${CROSS_SCOUT_MAILBOX_ADDRESS}"
      BRIDGE_ADDRESSES: "${CROSS_SCOUT_BRIDGE_ADDRESSES}"
      DISPUTE_GAME_FACTORY_ADDRESS: "${SP_L1_DISPUTE_GAME_FACTORY}"
      ANCHOR_STATE_REGISTRY_ADDRESS: "${CROSS_SCOUT_ANCHOR_STATE_REGISTRY_ADDRESS:-}"
      COMPOSE_GAME_TYPE: "${CROSS_SCOUT_COMPOSE_GAME_TYPE:-5555}"
      EL_START_BLOCK: "${CROSS_SCOUT_EL_START_BLOCK:-latest}"
      L1_START_BLOCK: "${CROSS_SCOUT_L1_START_BLOCK:-latest}"
      LOG_MAX_RANGE: "${CROSS_SCOUT_LOG_MAX_RANGE:-5000}"
      STALL_TIMEOUT_SECONDS: "${CROSS_SCOUT_STALL_TIMEOUT_SECONDS:-3840}"
      RUST_LOG: "${CROSS_SCOUT_RUST_LOG:-info}"
    restart: unless-stopped

  cross-scout-indexer-b:
    image: local/cross-scout-indexer:dev
    container_name: cross-scout-indexer-b
    labels:
      - "stack=localnet-l2"
    networks:
      - localnet-l2
    depends_on:
      cross-scout-postgres:
        condition: service_healthy
      cross-scout-redis:
        condition: service_healthy
    environment:
      HOST_CHAIN_ID: "${ROLLUP_B_CHAIN_ID}"
      L1_CHAIN_ID: "${L1_CHAIN_ID}"
      DATABASE_URL: "${CROSS_SCOUT_DATABASE_URL}"
      REDIS_URL: "${CROSS_SCOUT_REDIS_URL}"
      EL_RPC_URLS: "${CROSS_SCOUT_EL_RPC_URLS}"
      FLASHBLOCKS_WS_URLS: "${CROSS_SCOUT_FLASHBLOCKS_WS_URLS:-}"
      L1_RPC_URL: "${L1_EL_URL}"
      MAILBOX_ADDRESS: "${CROSS_SCOUT_MAILBOX_ADDRESS}"
      BRIDGE_ADDRESSES: "${CROSS_SCOUT_BRIDGE_ADDRESSES}"
      DISPUTE_GAME_FACTORY_ADDRESS: "${SP_L1_DISPUTE_GAME_FACTORY}"
      ANCHOR_STATE_REGISTRY_ADDRESS: "${CROSS_SCOUT_ANCHOR_STATE_REGISTRY_ADDRESS:-}"
      COMPOSE_GAME_TYPE: "${CROSS_SCOUT_COMPOSE_GAME_TYPE:-5555}"
      EL_START_BLOCK: "${CROSS_SCOUT_EL_START_BLOCK:-latest}"
      L1_START_BLOCK: "${CROSS_SCOUT_L1_START_BLOCK:-latest}"
      LOG_MAX_RANGE: "${CROSS_SCOUT_LOG_MAX_RANGE:-5000}"
      STALL_TIMEOUT_SECONDS: "${CROSS_SCOUT_STALL_TIMEOUT_SECONDS:-3840}"
      RUST_LOG: "${CROSS_SCOUT_RUST_LOG:-info}"
    restart: unless-stopped

  cross-scout-api:
    build:
      context: ${CROSS_SCOUT_PATH}
      dockerfile: Dockerfile.api
    image: local/cross-scout-api:dev
    container_name: cross-scout-api
    labels:
      - "stack=localnet-l2"
    networks:
      - localnet-l2
    depends_on:
      cross-scout-postgres:
        condition: service_healthy
      cross-scout-redis:
        condition: service_healthy
    environment:
      HOST_CHAIN_ID: "${ROLLUP_A_CHAIN_ID}"
      DATABASE_URL: "${CROSS_SCOUT_DATABASE_URL}"
      REDIS_URL: "${CROSS_SCOUT_REDIS_URL}"
      API_HOST: "0.0.0.0"
      API_PORT: "3001"
    ports:
      - "${CROSS_SCOUT_API_PORT:-3001}:3001"
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://127.0.0.1:3001/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  cross-scout-explorer:
    build:
      context: ${CROSS_SCOUT_PATH}
      dockerfile: Dockerfile.explorer
      args:
        VITE_API_URL: "http://localhost:${CROSS_SCOUT_API_PORT:-3001}"
        VITE_CHAIN_NAMES: "${CROSS_SCOUT_CHAIN_NAMES}"
    image: local/cross-scout-explorer:dev
    container_name: cross-scout-explorer
    labels:
      - "stack=localnet-l2"
    networks:
      - localnet-l2
    depends_on:
      cross-scout-api:
        condition: service_healthy
    ports:
      - "${CROSS_SCOUT_EXPLORER_PORT:-3002}:3000"
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  cross-scout-postgres:
  cross-scout-redis:
